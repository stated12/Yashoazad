name: Unpack zip
on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip, commit and remove the zip files
        run: |
          for z in *.zip; do
            [ -e "$z" ] || continue
            unzip -o "$z" -d .
            rm "$z"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add author publishing system" || echo "nothing to commit"
          git push
