name: Unpack site

'on':
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract website
        run: unzip -o legal-update.zip -d .

      - name: Remove ZIP
        run: rm legal-update.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Apply legal updates" && git push)

### Step 2
Commit the changes to `main`.

This version quotes `'on'` to avoid the YAML parser issue.

