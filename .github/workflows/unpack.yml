name: Unpack site
on:
  push:
    paths:
      - "site.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip, commit and remove the zip
        run: |
          unzip -o site.zip -d .
          rm site.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add website files" || echo "nothing to commit"
          git push
